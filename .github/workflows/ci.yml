name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge:
    name: wechat-bridge (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test packages/wechat-bridge/test/*.test.js

  sidecar:
    name: hermes-sidecar (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s packages/hermes-sidecar/tests -v

  e2e:
    name: 端到端验收 T1-T8
    runs-on: ubuntu-latest
    needs: [bridge, sidecar]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node test/e2e.js
