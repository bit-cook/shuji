name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: wechat-bridge (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 语法自检：所有源码文件都能被 Node 解析
      - name: node --check 全部源码
        run: |
          for f in $(git ls-files 'packages/wechat-bridge/src/**/*.js' 'test/*.js'); do
            node --check "$f" || exit 1
          done
      - name: CLI --check 配置校验路径可用
        run: |
          MC_BASE=http://127.0.0.1:3000 MC_API_KEY=k WECHAT_ALLOW_FROM=me \
            node packages/wechat-bridge/src/cli.js --check
      - run: node --test packages/wechat-bridge/test/*.test.js

  sidecar:
    name: hermes-sidecar (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s packages/hermes-sidecar/tests -v
      - name: --dry-run 报文自检（不发送）
        run: |
          MC_BASE=http://127.0.0.1:3000 MC_API_KEY=k \
            python3 packages/hermes-sidecar/sidecar.py --dry-run --once

  # 控制面依赖 node:sqlite：Node 24 起无需实验 flag
  mission-control:
    name: mission-control (node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: node --check 全部源码
        run: |
          for f in $(git ls-files 'packages/mission-control/src/**/*.js'); do
            node --check "$f" || exit 1
          done
      - name: CLI --version / --help / --check
        run: |
          node packages/mission-control/src/cli.js --version
          node packages/mission-control/src/cli.js --help
          node packages/mission-control/src/cli.js --check; test $? -eq 2   # 无 MC_API_KEY 必须拒绝
          MC_API_KEY=$(printf 'k%.0s' $(seq 32)) MC_DB=/tmp/mc-ci.db \
            node packages/mission-control/src/cli.js --check
      - run: node --test packages/mission-control/test/*.test.js

  plugin:
    name: openclaw-plugin (tsc + node:test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/openclaw-cardinal-plugin/package-lock.json
      - run: npm ci
        working-directory: packages/openclaw-cardinal-plugin
      - run: npx tsc --noEmit
        working-directory: packages/openclaw-cardinal-plugin
      - run: node --test test/*.test.ts
        working-directory: packages/openclaw-cardinal-plugin

  deploy:
    name: deploy manifests (bash + systemd)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh 语法检查
        run: bash -n deploy/install.sh
      - name: install.sh --dry-run（不落盘）
        run: bash deploy/install.sh --dest /tmp/shuji-dryrun --dry-run
      - name: systemd 单元校验（缺失文件只警告不失败）
        run: |
          if command -v systemd-analyze >/dev/null; then
            for u in deploy/systemd/*.service; do
              echo "== $u"
              systemd-analyze verify "$u" || echo "::warning file=$u::systemd-analyze 有警告（路径类告警可忽略）"
            done
          else
            echo "systemd-analyze 不可用，跳过"
          fi
      - name: docker-compose 配置可解析
        run: |
          if command -v docker >/dev/null; then
            docker compose -f deploy/docker-compose.yml config >/dev/null \
              || echo "::warning::compose config 需要构建上下文/密钥，跳过"
          else
            echo "docker 不可用，跳过"
          fi

  e2e:
    name: 端到端验收 T1-T22
    runs-on: ubuntu-latest
    needs: [bridge, sidecar, plugin, mission-control]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node test/e2e.js
