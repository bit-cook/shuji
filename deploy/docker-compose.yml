services:
  # 控制面（枢机自研，MIT）。只绑 Tailscale 网卡地址，不暴露公网。
  # Node 24：node:sqlite 在该版本无需实验 flag。
  mission-control:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.mission-control
    env_file: ./env/mission-control.env   # 由 deploy/env/mission-control.env.example 复制而来
    environment:
      MC_HOST: 0.0.0.0                    # 容器内通配绑定；对外仍只发布到回环/Tailscale
      ALLOW_PUBLIC_BIND: "1"              # 容器网络由上面的 ports 决定，非公网暴露
      MC_DB: /var/lib/mission-control/mission-control.db
      MC_AUDIT_LOG: /var/log/mission-control/audit.jsonl
      MC_API_KEY: ${MC_API_KEY:?需要在 deploy/env/mission-control.env 里配置 MC_API_KEY}
    ports:
      - "${MC_TAILSCALE_IP:-127.0.0.1}:3000:3000"
    volumes:
      - mc-data:/var/lib/mission-control
      - mc-logs:/var/log/mission-control
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]

  # 命令路由 · OpenClaw 插件入口（枢机自研）。OpenClaw 主机上的
  # cardinal-bridge 插件把微信（ClawBot）消息 POST 到本服务的 /openclaw。
  wechat-bridge:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.bridge
    env_file: ./env/wechat-bridge.env   # 由 deploy/env/wechat-bridge.env.example 复制而来
    environment:
      MC_BASE: http://mission-control:3000
      ADAPTER: http
      HOST: 0.0.0.0                     # 容器内通配绑定；对外仍只发布到回环/Tailscale
      ALLOW_PUBLIC_BIND: "1"            # 容器网络由上面的 ports 决定，非公网暴露
      AUDIT_LOG: /var/log/wechat-bridge/audit.jsonl
      BRIDGE_TOKEN: ${BRIDGE_TOKEN:?需要在 deploy/.env 里配置 BRIDGE_TOKEN（OpenClaw 插件同一值）}
    ports:
      - "${BRIDGE_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - bridge-logs:/var/log/wechat-bridge   # 审计日志落盘（read_only 下唯一可写处）
    depends_on:
      - mission-control
    restart: unless-stopped
    # 最小权限（红线）
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]

  # 命令路由 · Telegram 入口（长轮询，无需公网地址）。
  # 独立 env 文件：白名单、审计、令牌与 HTTP 入口互不干扰。
  wechat-bridge-telegram:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.bridge
    env_file: ./env/wechat-bridge-telegram.env   # 机器人令牌只在这里，别处不重复
    environment:
      # 令牌与白名单、审计路径都来自 env_file（不要在这里再写一遍 TELEGRAM_BOT_TOKEN，
      # environment 会覆盖 env_file，等于要求同一个密钥在两个地方各存一份）
      MC_BASE: http://mission-control:3000
      ADAPTER: telegram
      AUDIT_LOG: /var/log/wechat-bridge/telegram-audit.jsonl
    volumes:
      - bridge-logs-telegram:/var/log/wechat-bridge
    depends_on:
      - mission-control
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]

  # 命令路由 · 微信入口（枢机自己实现的 iLink 连接，不依赖 OpenClaw）。
  # 注意：扫码登录是一次性交互步骤，容器里做不了——先在宿主机以 wechat-bridge
  # 账号跑一次 --login 生成 state.json，再把它以卷的形式挂进来：
  #   sudo -u wechat-bridge WECHAT_STATE_FILE=... node .../cli.js --adapter weixin --login
  #   docker run -v bridge-weixin-state:/var/lib/wechat-bridge-weixin … （或 bind mount）
  wechat-bridge-weixin:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile.bridge
    env_file: ./env/wechat-bridge-weixin.env   # 机器人令牌在状态文件里，不在这里重复
    environment:
      MC_BASE: http://mission-control:3000
      ADAPTER: weixin
      AUDIT_LOG: /var/log/wechat-bridge/weixin-audit.jsonl
      WECHAT_STATE_FILE: /var/lib/wechat-bridge-weixin/state.json
    volumes:
      - bridge-logs-weixin:/var/log/wechat-bridge
      - bridge-weixin-state:/var/lib/wechat-bridge-weixin   # 扫码登录得到的令牌（0600）
    depends_on:
      - mission-control
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]

volumes:
  bridge-logs:
  bridge-logs-telegram:
  bridge-logs-weixin:
  bridge-weixin-state:
  mc-data:
  mc-logs:
